name: 发布 npm 和 GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出版本源码
        uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: 核对标签与包版本
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "标签 $GITHUB_REF_NAME 与包版本 $version 不一致" >&2
            exit 1
          fi

      - name: 安装依赖
        run: npm ci

      - name: 检查语法
        run: npm run check

      - name: 运行测试
        run: npm test

      # 0.1.0 已手动发布，只为该标签创建 GitHub Release。
      - name: 打包 npm 发布产物
        if: github.ref_name != 'v0.1.0'
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - name: 通过 Trusted Publishing 发布到 npm
        if: github.ref_name != 'v0.1.0'
        run: npm publish "$RUNNER_TEMP/dsh-model-meta-fill-${GITHUB_REF_NAME#v}.tgz" --access public --ignore-scripts

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
