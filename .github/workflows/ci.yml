name: 检查插件

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查语法
        run: npm run check

      - name: 运行测试
        run: npm test

      - name: 检查 npm 打包清单
        run: npm pack --dry-run --ignore-scripts
